# Produces the natural-voice MP3s on GitHub's servers whenever the spoken
# explanations (audio.js) or the voice settings change, and commits them back.
# Needs the repository secret ELEVENLABS_API_KEY (Settings -> Secrets and variables -> Actions).
name: Generate audio

on:
  push:
    branches: [main]
    paths:
      - audio.js
      - tools/elevenlabs-settings.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for the API key
        id: key
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::warning::The ELEVENLABS_API_KEY secret is not set, so no audio was generated."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate MP3 files
        if: steps.key.outputs.ok == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node tools/generate-audio.mjs

      - name: Commit the new files
        # Runs even if generation stopped half way, so finished files are kept.
        if: always() && steps.key.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio audio-files.js
          if git diff --cached --quiet; then
            echo "No new audio files."
            exit 0
          fi
          git commit -m "Generate audio for updated explanations"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
